<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier change report</title>
  <style>
    .viz-root {
      color-scheme: light;
      --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
      --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10); --series-1: #2a78d6; --focus: #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        color-scheme: dark;
        --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
        --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10); --series-1: #3987e5; --focus: #3987e5;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 1.5rem; }
    .wrap { max-width: 64rem; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; font-weight: 650; }
    .sub { color: var(--text-secondary); font-size: .9rem; margin: 0 0 1rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-bottom: 1.25rem; }
    .controls label { display: flex; flex-direction: column; gap: .25rem; font-size: .8rem; color: var(--text-secondary); }
    .controls input, .controls button { font: inherit; font-size: .9rem; padding: .4rem .6rem; border: 1px solid var(--baseline); border-radius: .4rem; background: var(--surface-1); color: var(--text-primary); }
    .controls button { cursor: pointer; }
    .controls button.primary { background: var(--series-1); color: #fff; border-color: var(--series-1); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
    .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: .6rem; padding: .8rem 1rem; }
    .tile .label { font-size: .8rem; color: var(--text-secondary); }
    .tile .value { font-size: 1.7rem; font-weight: 600; margin-top: .15rem; }
    .tile .hint { font-size: .75rem; color: var(--text-muted); margin-top: .1rem; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(28rem, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
    .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: .6rem; padding: .9rem 1rem; break-inside: avoid; }
    .card h2 { font-size: .95rem; margin: 0 0 .5rem; font-weight: 600; }
    .card svg { display: block; width: 100%; height: auto; overflow: visible; }
    .card svg text { font-family: inherit; }
    .empty { color: var(--text-muted); font-size: .85rem; padding: .5rem 0; }
    .bar { fill: var(--series-1); }
    .bar-hit:hover + .bar, .bar-hit:focus + .bar { opacity: .8; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--grid); vertical-align: top; }
    th { color: var(--text-secondary); font-weight: 600; }
    td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .foot { color: var(--text-muted); font-size: .75rem; margin-top: 1rem; line-height: 1.5; }
    .tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
           border-radius: .4rem; padding: .3rem .5rem; font-size: .8rem; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; }
    .error { border: 1px solid #d03b3b; border-radius: .5rem; padding: .75rem 1rem; background: var(--surface-1); }
    @media print {
      .viz-root { background: #fff; padding: 0; }
      .controls, .tip { display: none !important; }
      .charts { grid-template-columns: 1fr 1fr; }
      .card, .tile { border-color: #ccc; }
    }
  </style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <h1>Supplier change report</h1>
    <p class="sub" id="sub">Change requests to supplier master data, by the day they were requested.</p>

    <div class="controls" role="group" aria-label="Report period">
      <label>From <input type="date" id="from"></label>
      <label>To <input type="date" id="to"></label>
      <button class="primary" id="run">Update</button>
      <button id="print">Print or save as PDF</button>
    </div>

    <div id="status" aria-live="polite"></div>
    <div class="tiles" id="tiles"></div>
    <div class="charts" id="charts"></div>
    <div class="card"><h2>Requests in the period</h2><div id="table"></div></div>
    <p class="foot" id="foot"></p>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
</div>
<script>
  // Reads the P4 InsightsService (role DataSteward or Auditor; the server refuses everyone else with 403).
  // Counts come from the database via OData $apply, so the report shows exactly what is stored.
  const BASE = '../odata/v4/insights/'
  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const fmt = n => new Intl.NumberFormat('en-GB').format(n)

  const today = new Date(), first = new Date(today.getFullYear(), today.getMonth(), 1)
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10)
  $('from').value = iso(first); $('to').value = iso(today)

  async function get(path) {
    const r = await fetch(BASE + path, { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
    if (!r.ok) throw new Error(r.status === 403 ? 'You need the DataSteward or Auditor role for this report (403).' : `The service answered ${r.status}.`)
    return (await r.json()).value
  }
  const grouped = (set, dims, period) =>
    get(`${set}?$apply=filter(requestedOn ge ${period.from} and requestedOn le ${period.to})/groupby((${dims}),aggregate(ID with countdistinct as n))`)

  // Single-series horizontal bars: <= 24px thick, 4px rounded data end, square at the baseline, value at the tip
  function bars(title, rows, labelOf) {
    if (!rows.length) return `<div class="card"><h2>${esc(title)}</h2><div class="empty">No requests in this period.</div></div>`
    rows = rows.slice().sort((a, b) => b.n - a.n)
    const W = 520, labelW = 170, valueW = 40, rowH = 32, barH = 20, plotW = W - labelW - valueW
    const max = Math.max(...rows.map(r => r.n))
    const H = rows.length * rowH + 8
    const body = rows.map((r, i) => {
      const y = i * rowH + 4, w = Math.max(2, Math.round(r.n / max * plotW)), cy = y + (rowH - barH) / 2
      const rr = Math.min(4, w / 2), x0 = labelW, x1 = labelW + w
      const path = `M${x0},${cy} H${x1 - rr} Q${x1},${cy} ${x1},${cy + rr} V${cy + barH - rr} Q${x1},${cy + barH} ${x1 - rr},${cy + barH} H${x0} Z`
      const label = labelOf(r)
      return `<text x="${labelW - 8}" y="${y + rowH / 2}" text-anchor="end" dominant-baseline="middle" font-size="12" fill="var(--text-secondary)">${esc(label)}</text>
        <rect class="bar-hit" x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" tabindex="0" data-tip="${esc(label)}: ${r.n} request${r.n === 1 ? '' : 's'}"></rect>
        <path class="bar" d="${path}"></path>
        <text x="${x1 + 6}" y="${y + rowH / 2}" dominant-baseline="middle" font-size="12" fill="var(--text-primary)">${fmt(r.n)}</text>`
    }).join('')
    return `<div class="card"><h2>${esc(title)}</h2>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: ${esc(rows.map(r => labelOf(r) + ' ' + r.n).join(', '))}">
        <line x1="${labelW}" x2="${labelW}" y1="0" y2="${H}" stroke="var(--baseline)" stroke-width="1"></line>${body}</svg></div>`
  }

  const tile = (label, value, hint) => `<div class="tile"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div>${hint ? `<div class="hint">${esc(hint)}</div>` : ''}</div>`
  const FIELD = { street: 'Street', houseNumber: 'House number', postalCode: 'Postal code', city: 'City', country: 'Country', name: 'Name', taxNumber: 'Tax number' }
  const MODE = { Auto: 'Auto (low risk, one person)', FourEyes: 'Four-eyes (steward)' }

  async function run() {
    const period = { from: $('from').value, to: $('to').value }
    if (!period.from || !period.to || period.from > period.to) { $('status').innerHTML = '<div class="error" role="alert">Choose a start date on or before the end date.</div>'; return }
    $('status').textContent = 'Loading…'
    try {
      const [byStatus, byRisk, byMode, bySupplier, byField, rows] = await Promise.all([
        grouped('RequestFacts', 'status,statusName', period),
        grouped('RequestFacts', 'riskTier,riskTierText', period),
        grouped('RequestFacts', 'approvalMode', period),
        grouped('RequestFacts', 'supplierName', period),
        grouped('ItemFacts', 'field', period),
        get(`RequestFacts?$filter=requestedOn ge ${period.from} and requestedOn le ${period.to}&$orderby=requestedOn desc&$top=500`)
      ])
      const count = code => byStatus.find(s => s.status === code)?.n ?? 0
      const total = byStatus.reduce((n, s) => n + s.n, 0)
      const auto = byMode.find(m => m.approvalMode === 'Auto')?.n ?? 0
      $('tiles').innerHTML =
        tile('Requests in the period', fmt(total)) +
        tile('Applied', fmt(count('A')), `${fmt(auto)} by one person (low risk)`) +
        tile('Waiting for a steward', fmt(count('S'))) +
        tile('Rejected', fmt(count('R'))) +
        tile('Not yet submitted', fmt(count('N')))
      $('charts').innerHTML =
        bars('Requests by status', byStatus, r => r.statusName ?? r.status) +
        bars('Requests by risk tier', byRisk, r => r.riskTierText ?? 'Not assessed') +
        bars('Requests by approval path', byMode.filter(m => m.approvalMode), r => MODE[r.approvalMode] ?? r.approvalMode) +
        bars('Changed fields', byField, r => FIELD[r.field] ?? r.field) +
        bars('Requests by supplier (top 10)', bySupplier.sort((a, b) => b.n - a.n).slice(0, 10), r => r.supplierName)
      $('table').innerHTML = rows.length ? `<table><thead><tr><th>Requested on</th><th>Supplier</th><th>Reason</th><th>Status</th><th>Risk</th><th>Approval path</th><th>Requested by</th><th>Decided by</th></tr></thead><tbody>${
        rows.map(r => `<tr><td class="num">${esc(r.requestedOn)}</td><td>${esc(r.supplierName)}</td><td>${esc(r.reason)}</td><td>${esc(r.statusName)}</td><td>${esc(r.riskTierText ?? '')}</td><td>${esc(MODE[r.approvalMode] ?? '')}</td><td>${esc(r.requestedBy)}</td><td>${esc(r.decidedBy ?? '')}</td></tr>`).join('')
      }</tbody></table>${rows.length === 500 ? '<p class="empty">Showing the newest 500 requests; narrow the period for the rest.</p>' : ''}` : '<div class="empty">No requests in this period.</div>'
      $('sub').textContent = `Change requests to supplier master data requested from ${period.from} to ${period.to}.`
      $('foot').textContent = `Generated ${new Date().toLocaleString('en-GB')} from the P4 database through InsightsService (SAP HANA Cloud when deployed; in-memory SQLite in a local test). All supplier data is fictional. Counts include every saved request; unsaved drafts are not counted.`
      $('status').textContent = ''
    } catch (e) {
      $('status').innerHTML = `<div class="error" role="alert">${esc(e.message)} Nothing is shown rather than wrong numbers. Reload, or check that the app is running.</div>`
      $('tiles').innerHTML = $('charts').innerHTML = $('table').innerHTML = ''
    }
  }

  // Hover / keyboard-focus tooltip on every bar row (hit area larger than the bar)
  const tip = $('tip')
  document.addEventListener('pointermove', e => {
    const t = e.target.closest?.('[data-tip]')
    if (!t) { tip.style.display = 'none'; return }
    tip.textContent = t.dataset.tip; tip.style.display = 'block'
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 12) + 'px'
  })
  document.addEventListener('focusin', e => {
    const t = e.target.closest?.('[data-tip]'); if (!t) return
    const b = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.display = 'block'
    tip.style.left = (b.left + 12) + 'px'; tip.style.top = (b.bottom + 4) + 'px'
  })
  document.addEventListener('focusout', () => { tip.style.display = 'none' })

  $('run').addEventListener('click', run)
  $('print').addEventListener('click', () => window.print())
  run()
</script>
</body>
</html>
